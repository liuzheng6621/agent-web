name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 零依赖：没有 npm install 这一步，跑不起来就是真跑不起来。
      - name: 单元测试
        run: npm test

      - name: 自测（内置适配器 + 内置案例）
        run: node bin/agent-web.mjs selftest

      - name: 骨架适配器（证明第三方能接进来）
        run: |
          node bin/agent-web.mjs verify examples/adapter-template/cases \
            --adapter=./examples/adapter-template/warehouse-adapter.mjs

      - name: 判决一致率必须为 100%
        run: |
          node bin/agent-web.mjs selftest --json > /tmp/selftest.json
          node -e '
            const fs = require("node:fs");
            const r = JSON.parse(fs.readFileSync("/tmp/selftest.json", "utf8"));
            const a = r.agreement;
            if (!a || a.rate.value !== 1) {
              console.error("与预期标签不一致：", JSON.stringify(a));
              process.exit(1);
            }
            console.log("一致率 100%，N =", a.checked);
          '

      # ---------------------------------------------------------------
      # 下面两步测的不是被测系统，是这个工具自己会不会放水。
      # ---------------------------------------------------------------

      - name: 未确认草稿不许产生判决
        run: |
          mkdir -p /tmp/draft-check
          node -e 'const fs=require("node:fs");const c=JSON.parse(fs.readFileSync("cases/coffee/happy-path.json","utf8"));c.draft={status:"unconfirmed",source:"ci"};fs.writeFileSync("/tmp/draft-check/happy-path.json",JSON.stringify(c,null,2));'
          node bin/agent-web.mjs verify /tmp/draft-check --adapter=memory --json |
            node -e 'let t="";process.stdin.on("data",d=>t+=d).on("end",()=>{const v=JSON.parse(t)[0];if(v.status!=="unknown"||v.reason_code!=="unconfirmed_draft"){console.error("未确认草稿竟然产生了判决：",v.status,v.reason_code);process.exit(1);}console.log("草稿被判 unknown/unconfirmed_draft OK");});'
          node bin/agent-web.mjs accept /tmp/draft-check/happy-path.json --by=ci
          node bin/agent-web.mjs verify /tmp/draft-check --adapter=memory

      - name: 陷阱普查必须真的指得出盲区
        run: |
          set -e
          node bin/agent-web.mjs verify cases/coffee --adapter=memory --out=.tmp-ci/traps.jsonl > /dev/null
          node bin/agent-web.mjs traps .tmp-ci/traps.jsonl --cases=cases/coffee --json > .tmp-ci/traps.json
          node - <<'JS'
          const r = require('./.tmp-ci/traps.json');
          const by = Object.fromEntries(r.traps.map((t) => [t.id, t]));
          // 报告可以难看，但探测器本身必须说得出话：
          // 「只看终态」这类结构性盲区必须被抓出来，否则这个命令就是装饰。
          if (by['terminal-only'].blind === 0) {
            console.error('终端断言盲区没被查出来，探测器失效了');
            process.exit(1);
          }
          // 身份塌缩在诚实实现上必须是「有据可查」，不能全是盲区
          if (by['identity-collapse'].guarded === 0) {
            console.error('诚实实现的身份映射没被认作有据可查，探测器过严');
            process.exit(1);
          }
          console.log('盲区率', r.blind_rate);
          JS

      - name: 判据准入：漏网的变异体必须正好是基线里那几个
        run: node scripts/certify-baseline.mjs

      - name: 判据准入自己能被证伪
        run: node scripts/certify-can-fail.mjs

      - name: 假绿必须被判红
        run: |
          node bin/agent-web.mjs verify cases/coffee --adapter=memory --out=/tmp/oracle.jsonl
          node -e 'const fs=require("node:fs");const L=fs.readFileSync("/tmp/oracle.jsonl","utf8").trim().split(String.fromCharCode(10)).map(JSON.parse);const bad=L.map(v=>v.status==="fail"?{...v,status:"pass",reason_code:"ok"}:v);fs.writeFileSync("/tmp/candidate.jsonl",bad.map(v=>JSON.stringify(v)).join(String.fromCharCode(10))+String.fromCharCode(10));'
          if node bin/agent-web.mjs audit /tmp/oracle.jsonl /tmp/candidate.jsonl; then
            echo "假绿没被抓住，audit 失效"; exit 1
          fi
          echo "假绿被判红 OK"

      - name: 能力覆盖率能点出故意留的缺口
        run: |
          node bin/agent-web.mjs coverage cases/coffee --adapter=memory --detail --json > /tmp/cov.json || true
          node -e '
            const fs = require("node:fs");
            const r = JSON.parse(fs.readFileSync("/tmp/cov.json", "utf8"));
            if (r.missing !== 1) { console.error("期望 1 条缺口，实际 " + r.missing); process.exit(1); }
            const hit = (r.missing_capabilities || [])[0];
            if (!hit || hit.id !== "order.refund") { console.error("缺口应指向 order.refund，实际 " + JSON.stringify(hit)); process.exit(1); }
            if (!(r.rate.value > 0 && r.rate.value < 1)) { console.error("覆盖率应当是中间值，实际 " + JSON.stringify(r.rate)); process.exit(1); }
            console.log("缺口被点名：" + hit.id + "，覆盖率 " + (r.rate.value * 100).toFixed(1) + "%");
          '

  # 真实后端那一半不在 CI 里：它需要一个跑着的 Spring Boot 实例。
  # 这不是缺口，是边界——cross-implementation 对照要么两边都真，要么就不做。
  # 本地跑法见 README「快速开始」第 3 条。

      - name: 出题与批改：好提交必须满分，偷懒提交必须零分
        run: |
          node bin/agent-web.mjs drill cases/coffee --adapter=memory --out=.tmp-drill
          node bin/agent-web.mjs drill grade .tmp-drill --submissions=examples/drills/good
          if node bin/agent-web.mjs drill grade .tmp-drill --submissions=examples/drills/lazy; then
            echo "偷懒提交居然通过了，批改器有问题"; exit 1
          fi
