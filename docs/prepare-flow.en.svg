<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">agent-web workflow: from action log to reviewable test case</title>
  <desc id="desc">Capture an action log in an isolated test environment, use prepare to create replayable steps, a draft checklist, and a flow preview; review and edit the rules, verify the case, and optionally compare independent systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101927"/><stop offset="1" stop-color="#142338"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#55d9c0"/><stop offset="1" stop-color="#77b8ff"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7894b4"/></marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020812" flood-opacity=".22"/></filter>
  </defs>
  <rect x="0" y="0" width="1280" height="700" rx="26" fill="url(#bg)"/>
  <circle cx="1114" cy="-72" r="255" fill="#2c5683" opacity=".12"/>
  <circle cx="-72" cy="616" r="238" fill="#38bea9" opacity=".07"/>
  <text x="48" y="48" fill="#80baff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2.4">AGENT-WEB · QUICK START</text>
  <text x="48" y="91" fill="#f0f5fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="750">From one action log to a reviewable test case</text>
  <text x="49" y="121" fill="#aebdd0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">The tool prepares the files. A person confirms the rules. Then run the formal check.</text>
  <rect x="1067" y="38" width="164" height="34" rx="17" fill="#1d3047" stroke="#365472"/>
  <circle cx="1087" cy="55" r="5" fill="#55d9c0"/>
  <text x="1101" y="60" fill="#c4d5e8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650">Recommended · v0.6</text>

  <g stroke="#7894b4" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M 248 295 H 268"/><path d="M 491 295 H 511"/><path d="M 734 295 H 754"/><path d="M 977 295 H 997"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="36" y="154" width="212" height="290" rx="15" fill="#182638" stroke="#30465f"/>
    <rect x="279" y="154" width="212" height="290" rx="15" fill="#182a3c" stroke="#3a6987"/>
    <rect x="522" y="154" width="212" height="290" rx="15" fill="#182638" stroke="#30465f"/>
    <rect x="765" y="154" width="212" height="290" rx="15" fill="#182638" stroke="#30465f"/>
    <rect x="1008" y="154" width="236" height="290" rx="15" fill="#182638" stroke="#45664f"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g>
      <circle cx="61" cy="181" r="14" fill="#24445a"/><text x="61" y="186" fill="#75dfcb" font-size="12" font-weight="750" text-anchor="middle">01</text>
      <text x="84" y="187" fill="#f0f5fb" font-size="17" font-weight="700">Capture one run</text>
      <text x="54" y="222" fill="#c1cede" font-size="13"><tspan x="54">Let the assistant finish a</tspan><tspan x="54" dy="21">task in an isolated test</tspan><tspan x="54" dy="21">system. Save its request log.</tspan></text>
      <rect x="54" y="304" width="176" height="40" rx="8" fill="#101a27" stroke="#31475d"/>
      <path d="M 68 317 h8 l4 4 h12 v13 h-24 z" fill="none" stroke="#80baff" stroke-width="1.5"/>
      <text x="102" y="329" fill="#d6e2ef" font-family="ui-monospace,Consolas,monospace" font-size="12">actions.jsonl</text>
      <text x="54" y="377" fill="#8fa4bb" font-size="11" font-weight="650" letter-spacing=".6">Input: JSONL or JSON</text>
      <text x="54" y="405" fill="#7890aa" font-size="11">Sample log included</text>
    </g>

    <g>
      <circle cx="304" cy="181" r="14" fill="#225448"/><text x="304" y="186" fill="#7ce4d1" font-size="12" font-weight="750" text-anchor="middle">02</text>
      <text x="327" y="187" fill="#f0f5fb" font-size="17" font-weight="700">Run prepare</text>
      <text x="297" y="222" fill="#c1cede" font-size="13"><tspan x="297">One command maps the</tspan><tspan x="297" dy="21">actions, replays them on the</tspan><tspan x="297" dy="21">test system, and checks state.</tspan></text>
      <rect x="297" y="304" width="176" height="64" rx="8" fill="#0f1a26" stroke="#31566a"/>
      <text x="309" y="328" fill="#78dfcb" font-family="ui-monospace,Consolas,monospace" font-size="11">agent-web prepare</text>
      <text x="309" y="348" fill="#c6d7e9" font-family="ui-monospace,Consolas,monospace" font-size="11">actions.jsonl --adapter=…</text>
      <text x="297" y="405" fill="#88d9c9" font-size="11" font-weight="650">No need to chain 3 commands</text>
    </g>

    <g>
      <circle cx="547" cy="181" r="14" fill="#24445a"/><text x="547" y="186" fill="#75dfcb" font-size="12" font-weight="750" text-anchor="middle">03</text>
      <text x="570" y="187" fill="#f0f5fb" font-size="17" font-weight="700">Get three files</text>
      <rect x="540" y="211" width="176" height="50" rx="8" fill="#102132" stroke="#2e4d66"/>
      <rect x="552" y="224" width="15" height="20" rx="2" fill="none" stroke="#79b9ff" stroke-width="1.5"/><path d="M 555 230 h9 M 555 235 h9" stroke="#79b9ff" stroke-width="1.2"/>
      <text x="576" y="232" fill="#e0ebf7" font-family="ui-monospace,Consolas,monospace" font-size="11">trajectory.json</text>
      <text x="576" y="248" fill="#94a9bf" font-size="10">Replayable actions</text>
      <rect x="540" y="270" width="176" height="58" rx="8" fill="#102132" stroke="#2e4d66"/>
      <rect x="552" y="284" width="15" height="20" rx="2" fill="none" stroke="#f2c46e" stroke-width="1.5"/><path d="M 555 290 h9 M 555 295 h9" stroke="#f2c46e" stroke-width="1.2"/>
      <text x="576" y="292" fill="#e0ebf7" font-family="ui-monospace,Consolas,monospace" font-size="11">case.draft.json</text>
      <text x="576" y="310" fill="#d8bc82" font-size="10">Unconfirmed checklist</text>
      <rect x="540" y="337" width="176" height="58" rx="8" fill="#102132" stroke="#2e4d66"/>
      <rect x="552" y="350" width="15" height="20" rx="2" fill="none" stroke="#67d8bd" stroke-width="1.5"/><path d="M 555 357 h9 M 555 362 h9" stroke="#67d8bd" stroke-width="1.2"/>
      <text x="576" y="359" fill="#e0ebf7" font-family="ui-monospace,Consolas,monospace" font-size="11">case.flow.html</text>
      <text x="576" y="378" fill="#91bfb9" font-size="10">Visual preview</text>
      <text x="540" y="421" fill="#8fa4bb" font-size="10">Open HTML directly</text>
    </g>

    <g>
      <circle cx="790" cy="181" r="14" fill="#564626"/><text x="790" y="186" fill="#f3cb7b" font-size="12" font-weight="750" text-anchor="middle">04</text>
      <text x="813" y="187" fill="#f0f5fb" font-size="17" font-weight="700">Review the draft</text>
      <text x="783" y="225" fill="#c1cede" font-size="13"><tspan x="783">Check people and actions</tspan><tspan x="783" dy="21">first. Then confirm the goal</tspan><tspan x="783" dy="21">and each business rule.</tspan></text>
      <path d="M 785 303 l5 5 l10 -12" fill="none" stroke="#66d9c0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="807" y="307" fill="#d4dfeb" font-size="12">Write the real goal</text>
      <path d="M 785 337 l5 5 l10 -12" fill="none" stroke="#f2c46e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="807" y="341" fill="#d4dfeb" font-size="12">Add negative cases</text>
      <path d="M 785 371 l5 5 l10 -12" fill="none" stroke="#80baff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="807" y="375" fill="#d4dfeb" font-size="12">Remove draft marker</text>
      <rect x="783" y="399" width="176" height="25" rx="6" fill="#392f1c"/>
      <text x="871" y="416" fill="#f0ca7c" font-size="10" font-weight="650" text-anchor="middle">Draft passes ≠ rules are right</text>
    </g>

    <g>
      <circle cx="1033" cy="181" r="14" fill="#294a39"/><text x="1033" y="186" fill="#7be0a3" font-size="12" font-weight="750" text-anchor="middle">05</text>
      <text x="1056" y="187" fill="#f0f5fb" font-size="17" font-weight="700">Run verify</text>
      <text x="1032" y="222" fill="#c1cede" font-size="13"><tspan x="1032">After confirming the rules,</tspan><tspan x="1032" dy="21">run the case as a formal test.</tspan></text>
      <rect x="1032" y="274" width="188" height="48" rx="8" fill="#101a27" stroke="#354c62"/>
      <text x="1044" y="294" fill="#7ce0cb" font-family="ui-monospace,Consolas,monospace" font-size="11">agent-web verify</text>
      <text x="1044" y="311" fill="#c8d7e6" font-family="ui-monospace,Consolas,monospace" font-size="10">case.json --adapter=…</text>
      <rect x="1032" y="339" width="56" height="27" rx="13.5" fill="#173b2d" stroke="#327452"/><text x="1060" y="357" fill="#82e4a9" font-size="11" font-weight="700" text-anchor="middle">PASS</text>
      <rect x="1097" y="339" width="56" height="27" rx="13.5" fill="#402329" stroke="#81404c"/><text x="1125" y="357" fill="#ff9aa2" font-size="11" font-weight="700" text-anchor="middle">FAIL</text>
      <rect x="1162" y="339" width="58" height="27" rx="13.5" fill="#312945" stroke="#57467d"/><text x="1191" y="357" fill="#cabaff" font-size="11" font-weight="700" text-anchor="middle">UNKNOWN</text>
      <text x="1032" y="395" fill="#8fa4bb" font-size="11">Unknown means not enough data.</text>
      <text x="1032" y="418" fill="#7890aa" font-size="10">Checks the rules, not copied steps</text>
    </g>
  </g>

  <rect x="36" y="473" width="1208" height="58" rx="12" fill="#15283a" stroke="#35516e"/>
  <circle cx="63" cy="502" r="12" fill="#24445a"/>
  <path d="M 63 495 v8 M 63 507 v1" stroke="#8ec3ff" stroke-width="2" stroke-linecap="round"/>
  <text x="86" y="498" fill="#dbe8f5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">Optional: compare two independent systems</text>
  <text x="86" y="518" fill="#aabbd0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Run the same confirmed case on both. A mismatch points to the rules, connector, or system behaviour.</text>
  <rect x="1015" y="487" width="204" height="31" rx="7" fill="#0e1a27" stroke="#314960"/>
  <text x="1117" y="507" fill="#91c6ff" font-family="ui-monospace,Consolas,monospace" font-size="11" text-anchor="middle">agent-web compare</text>

  <rect x="36" y="550" width="1208" height="78" rx="12" fill="#2b2418" stroke="#68542e"/>
  <path d="M 61 574 l10 18 h-20 z" fill="none" stroke="#f1c36b" stroke-width="1.7" stroke-linejoin="round"/>
  <path d="M 61 580 v5 M 61 588 v1" stroke="#f1c36b" stroke-width="1.7" stroke-linecap="round"/>
  <text x="86" y="578" fill="#f4d590" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750">Safety boundaries</text>
  <text x="86" y="600" fill="#d8c69f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Use an isolated test system, never production. Keep passwords, tokens, and cookies out of logs. A person must confirm each draft before it becomes a test.</text>
  <text x="1218" y="670" fill="#62758b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" text-anchor="end">agent-web v0.6 · workflow guide</text>
</svg>
