<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>memory/foreign-pickup · agent-web flow</title>
<style>
:root{color-scheme:dark;--bg:#10151d;--panel:#171f2b;--panel2:#1d2836;--line:#304155;--text:#e7edf5;--muted:#a5b2c2;--blue:#7bb8ff;--teal:#48d5be;--red:#ff7783;--amber:#f7c66d;--green:#55d89a;--unknown:#b4a7ff;--mono:ui-monospace,SFMono-Regular,Consolas,monospace;--sans:Inter,"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#1b2839 0,transparent 48%),var(--bg);color:var(--text);font:15px/1.5 var(--sans)}button{font:inherit;color:inherit}.wrap{max-width:1180px;margin:0 auto;padding:32px 28px 60px}.top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:22px}.eyebrow{font:700 11px var(--mono);letter-spacing:.14em;color:var(--blue);text-transform:uppercase}.title{margin:7px 0 4px;font-size:clamp(24px,4vw,36px);line-height:1.15;letter-spacing:-.03em}.goal{color:var(--muted);max-width:760px;margin:8px 0 0}.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#131b25;border-radius:999px;padding:8px 12px;color:var(--muted);white-space:nowrap;font:12px var(--mono)}.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.pass .dot,.dot.pass{background:var(--green);box-shadow:0 0 12px #55d89a66}.fail .dot,.dot.fail{background:var(--red);box-shadow:0 0 12px #ff778366}.unknown .dot,.dot.unknown{background:var(--unknown)}.planned .dot{background:var(--blue)}.not_run .dot{background:var(--muted)}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 26px}.tool{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 12px;font-size:12px;cursor:pointer}.tool:hover,.tool.active{border-color:var(--blue);color:var(--blue)}.legend{display:flex;gap:15px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-left:auto;align-items:center}.legend span{display:inline-flex;gap:6px;align-items:center}.legend .dot{width:7px;height:7px}.section{margin-top:27px}.section-head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px}.section h2{font-size:15px;margin:0;letter-spacing:.01em}.section-head small{color:var(--muted);font:11px var(--mono)}.timeline{position:relative;display:grid;gap:13px}.timeline:before{content:"";position:absolute;left:20px;top:24px;bottom:24px;width:1px;background:linear-gradient(var(--blue),var(--line) 80%,transparent)}.step{position:relative;margin-left:50px;border:1px solid var(--line);border-radius:13px;background:linear-gradient(115deg,#1a2431,#151d28);overflow:hidden;box-shadow:0 9px 24px #0002}.step[hidden]{display:none}.step-main{display:grid;grid-template-columns:40px minmax(130px,1fr) minmax(100px,.7fr) minmax(130px,.8fr);gap:12px;align-items:center;padding:16px 18px;cursor:pointer}.node{position:absolute;left:-43px;top:20px;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#1b2939;border:1px solid #5383b2;color:var(--blue);font:11px var(--mono);box-shadow:0 0 0 5px var(--bg)}.step-id{font:11px var(--mono);color:var(--muted)}.cap{font-weight:700;overflow-wrap:anywhere}.role{justify-self:start;border:1px solid #3e536c;border-radius:6px;background:#1a2a3b;color:#a9d0ff;padding:4px 8px;font:11px var(--mono)}.outcome{justify-self:end;text-align:right}.pill{display:inline-block;border-radius:6px;padding:4px 8px;font:11px var(--mono);border:1px solid var(--line);color:var(--muted);background:#111922}.pill.pass,.pill.applied{color:var(--green);border-color:#2e7455;background:#142920}.pill.fail,.pill.rejected{color:var(--red);border-color:#79434c;background:#2d1c23}.pill.unknown,.pill.unsupported,.pill.infra_error{color:var(--amber);border-color:#705d35;background:#292416}.step-detail{display:none;border-top:1px solid var(--line);padding:13px 18px;background:#121922}.step.open .step-detail{display:block}.detail-label{font:10px var(--mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:7px}.code{font:12px/1.55 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:#cdd8e6;background:#0c1219;border:1px solid #273546;border-radius:8px;padding:11px}.error{color:var(--red);margin-top:8px;font-size:12px}.connector{position:absolute;left:20px;bottom:-13px;height:13px;width:1px;background:var(--line)}.step:last-child .connector{display:none}.empty{padding:24px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}.event-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.event{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px}.event-top{font:11px var(--mono);color:var(--teal)}.event-transition{font-weight:700;margin:5px 0}.event-meta{font:11px var(--mono);color:var(--muted)}.assertions{display:grid;gap:9px}.assertion{display:grid;grid-template-columns:84px 145px minmax(120px,1fr) auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);background:var(--panel);border-radius:10px}.assertion[hidden]{display:none}.assertion-kind{font:11px var(--mono);color:#b9c8da}.assertion-selector{font:11px var(--mono);color:var(--muted);overflow-wrap:anywhere}.assertion-message{font-size:12px;color:var(--muted)}.assertion-status{font:11px var(--mono);white-space:nowrap}.assertion-status.true{color:var(--green)}.assertion-status.false{color:var(--red)}.assertion-status.unknown{color:var(--amber)}.footer{color:#8291a4;font-size:11px;margin-top:35px;padding-top:14px;border-top:1px solid var(--line)}.draft-note{margin-top:12px;padding:10px 12px;border:1px solid #75603a;background:#282315;color:#f3d68f;border-radius:9px;font-size:12px}.summary{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.metric{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 12px;color:var(--muted);font-size:12px}.metric b{font:700 13px var(--mono);color:var(--text);margin-right:4px}
@media(max-width:700px){.wrap{padding:22px 15px 44px}.top{display:block}.top>.badge{margin-top:14px}.step-main{grid-template-columns:28px minmax(0,1fr) auto;gap:8px;padding:13px}.step-main .role{grid-column:2}.outcome{grid-column:3;grid-row:1/3}.assertion{grid-template-columns:70px 1fr auto}.assertion-message{grid-column:1/-1}.timeline:before{left:12px}.node{left:-40px}.legend{margin-left:0}.section-head{gap:12px}}
@media(prefers-reduced-motion:no-preference){.step{transition:border-color .15s,transform .15s}.step:hover{border-color:#53769a;transform:translateX(2px)}}
</style>
</head>
<body>
<script type="application/json" id="flow-data">{"schema":"agent-web/flow/1","title":"memory/foreign-pickup","caseId":"memory/foreign-pickup","naturalGoal":"另一位顾客替下单人去取那杯咖啡。","verdict":"fail","verdictReason":"unexpected_rejection","verdictDetail":"order.pick 被拒绝：not_owner 订单 1001 不属于 bob","trajectorySource":"reference","steps":[{"index":1,"id":"s1","capability":"order.create","role":"customer","expected":"applied","actual":"applied","error":null,"arguments":{"items":[{"dishName":"拿铁","qty":1}]},"hasBindings":false,"execution":"executed"},{"index":2,"id":"s2","capability":"kitchen.accept","role":"staff","expected":"applied","actual":"applied","error":null,"arguments":{"orderId":"$s1.orderId"},"hasBindings":true,"execution":"executed"},{"index":3,"id":"s3","capability":"kitchen.ready","role":"staff","expected":"applied","actual":"applied","error":null,"arguments":{"orderId":"$s1.orderId"},"hasBindings":true,"execution":"executed"},{"index":4,"id":"s4","capability":"order.pick","role":"customer2","expected":"applied","actual":"rejected","error":{"code":"not_owner","message":"订单 1001 不属于 bob"},"arguments":{"orderId":"$s1.orderId"},"hasBindings":true,"execution":"executed"}],"events":[{"index":1,"type":"order.created","from":null,"to":"PENDING","by":"alice","orderId":1001,"at":1767225601000},{"index":2,"type":"order.making","from":"PENDING","to":"MAKING","by":"barista","orderId":1001,"at":1767225602000},{"index":3,"type":"order.ready","from":"MAKING","to":"READY","by":"barista","orderId":1001,"at":1767225603000}],"eventsComplete":true,"assertions":[{"index":0,"phase":"goal","kind":"field_equals","selector":{"collection":"orders","index":0},"path":"status","expected":"PICKED","result":"false","code":"field_mismatch","message":"status 实际 \"READY\"，期望 \"PICKED\""}],"assertionSummary":{"goal":1,"invariant":0,"evaluated":1},"draftStatus":null}</script>
<div id="app"></div>
<script>
const DATA=JSON.parse(document.getElementById('flow-data').textContent);
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const json=(v)=>JSON.stringify(v,null,2);
const statusName=(v)=>({pass:'PASS',fail:'FAIL',unknown:'UNKNOWN',true:'TRUE',false:'FALSE',unavailable:'待运行',applied:'applied',rejected:'rejected',unsupported:'unsupported',infra_error:'infra_error'}[v]||String(v||'待运行'));
const root=document.getElementById('app');
const verdictClass=DATA.verdict||'planned';
const outcomeBadge=(step)=>{
  if(step.execution==='not_run')return '<span class="pill">未执行</span>';
  if(step.actual)return '<span class="pill '+esc(step.actual)+'">实际 '+esc(statusName(step.actual))+'</span>';
  return '<span class="pill">预期 '+esc(statusName(step.expected))+'</span>';
};
const stepHtml=(s)=>'<article class="step '+esc(s.execution)+'" data-role="'+esc(s.role)+'" data-outcome="'+esc(s.actual||s.expected)+'" data-expected="'+esc(s.expected)+'" data-actual="'+esc(s.actual||'')+'"><span class="node">'+s.index+'</span><div class="step-main" role="button" tabindex="0" aria-expanded="false"><span class="step-id">'+esc(s.id)+'</span><span class="cap">'+esc(s.capability)+'</span><span class="role">'+esc(s.role)+'</span><span class="outcome">'+(s.actual&&s.actual!==s.expected?'<span class="pill">期望 '+esc(statusName(s.expected))+'</span> ': '')+outcomeBadge(s)+'</span></div><div class="step-detail"><div class="detail-label">'+(s.hasBindings?'参数绑定':'动作参数')+'</div><div class="code">'+esc(json(s.arguments))+'</div>'+(s.error?'<div class="error">'+esc(s.error.code||'error')+': '+esc(s.error.message||'')+'</div>':'')+'</div></article>';
const eventHtml=(e)=>'<article class="event"><div class="event-top">'+esc(e.index)+' · '+esc(e.type)+'</div><div class="event-transition">'+(e.from!==null?esc(e.from)+' → ':'')+esc(e.to??e.type)+'</div><div class="event-meta">'+[e.by?'by '+e.by:null,e.orderId!==null?'order '+e.orderId:null,e.at!==null?'at '+e.at:null].filter(Boolean).map(esc).join(' · ')+'</div></article>';
const assertionHtml=(a)=>'<article class="assertion" data-status="'+esc(a.result)+'"><span class="assertion-kind">'+esc(a.phase)+'</span><span class="assertion-kind">'+esc(a.kind)+'</span><span class="assertion-selector">'+esc(a.selector?.collection||'')+(a.selector?.index!==undefined?' #'+a.selector.index:'')+(a.path?'.'+esc(a.path):'')+'</span><span class="assertion-status '+esc(a.result)+'">'+esc(statusName(a.result))+'</span>'+(a.message?'<span class="assertion-message">'+esc(a.message)+'</span>':'')+'</article>';
const verdictLabel=DATA.verdict?statusName(DATA.verdict):'PLAN';
root.innerHTML='<main class="wrap"><header class="top"><div><div class="eyebrow">agent-web · workflow map</div><h1 class="title">'+esc(DATA.title)+'</h1><p class="goal">'+esc(DATA.naturalGoal||'没有自然语言目标。可在 task.natural_goal 中补充。')+'</p></div><div class="badge '+esc(verdictClass)+'"><i class="dot"></i>'+esc(verdictLabel)+(DATA.verdictReason?' · '+esc(DATA.verdictReason):'')+'</div></header><div class="summary"><span class="metric"><b>'+DATA.steps.length+'</b> 步</span><span class="metric"><b>'+esc(DATA.trajectorySource)+'</b> 轨迹来源</span><span class="metric"><b>'+DATA.assertionSummary.goal+'</b> 目标断言</span><span class="metric"><b>'+DATA.assertionSummary.invariant+'</b> 不变量</span>'+(DATA.verdict?'<span class="metric"><b>'+DATA.assertionSummary.evaluated+'</b> 已求值断言</span>':'')+'</div>'+(DATA.draftStatus?'<div class="draft-note">案例草稿：'+esc(DATA.draftStatus)+'。草稿断言描述的是这次运行实际发生的事，不等同于正确的验收标准。</div>':'')+'<div class="tools"><button class="tool active" data-filter="all">全部步骤</button><button class="tool" data-filter="mismatch">只看偏差</button><button class="tool" data-filter="not_run">未执行</button><button class="tool" id="expand">展开参数</button><div class="legend"><span><i class="dot pass"></i>通过</span><span><i class="dot fail"></i>失败</span><span><i class="dot unknown"></i>未知</span><span><i class="dot planned"></i>计划</span></div></div><section class="section"><div class="section-head"><h2>执行流程</h2><small>'+esc(DATA.trajectorySource)+' trajectory · 点击步骤查看参数</small></div><div class="timeline">'+(DATA.steps.length?DATA.steps.map(stepHtml).join(''):'<div class="empty">没有轨迹步骤</div>')+'</div></section><section class="section"><div class="section-head"><h2>状态事件</h2><small>'+DATA.events.length+' events · '+(DATA.eventsComplete?'完整':'未声明完整')+'</small></div>'+(DATA.events.length?'<div class="event-list">'+DATA.events.map(eventHtml).join('')+'</div>':'<div class="empty">没有随判决结果提供事件观测。传入 verify 输出的 --result 文件即可显示。</div>')+'</section><section class="section"><div class="section-head"><h2>判据结果</h2><small>'+DATA.assertionSummary.evaluated+' / '+DATA.assertions.length+' evaluated</small></div>'+(DATA.assertions.length?'<div class="assertions">'+DATA.assertions.map(assertionHtml).join('')+'</div>':'<div class="empty">案例没有断言。</div>')+'</section>'+(DATA.verdictDetail?'<section class="section"><div class="section-head"><h2>判决说明</h2><small>'+esc(DATA.verdictReason||'')+'</small></div><div class="empty">'+esc(DATA.verdictDetail)+'</div></section>':'')+'<div class="footer">Generated by agent-web flow · '+esc(DATA.caseId)+' · 此页面只可视化输入，不会执行或修改被测系统。</div></main>';
document.querySelectorAll('.step-main').forEach(el=>{const toggle=()=>{const card=el.closest('.step');card.classList.toggle('open');el.setAttribute('aria-expanded',card.classList.contains('open')?'true':'false')};el.addEventListener('click',toggle);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}})});
document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===btn));const f=btn.dataset.filter;document.querySelectorAll('.step').forEach(s=>{const mismatch=(s.dataset.actual!==''&&s.dataset.actual!==s.dataset.expected)||s.classList.contains('not_run');const show=f==='all'||(f==='not_run'&&s.classList.contains('not_run'))||(f==='mismatch'&&mismatch);s.hidden=!show})}));
let expanded=false;document.getElementById('expand').addEventListener('click',e=>{expanded=!expanded;document.querySelectorAll('.step').forEach(s=>{s.classList.toggle('open',expanded);s.querySelector('.step-main').setAttribute('aria-expanded',expanded?'true':'false')});e.currentTarget.textContent=expanded?'收起参数':'展开参数'});
</script>
</body>
